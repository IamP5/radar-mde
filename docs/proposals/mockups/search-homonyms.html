<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Rascunho: homônimos</title>
<style>
  body { margin: 0; background: #f4f1ea; font: 16px/1.4 "Segoe UI", sans-serif; color: #1c1915; }
  .frame { width: 880px; margin: 24px auto; background: #fff; border: 1px solid #d9d3c7; }
  .banner { background: #efe6d2; padding: 8px 16px; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
  header { padding: 14px 16px; border-bottom: 1px solid #eee; font-weight: 700; }
  .dialog { margin: 28px auto 36px; width: 560px; border: 1px solid #1c1915; }
  .field { padding: 12px 14px; border-bottom: 1px solid #1c1915; font-size: 18px; }
  .group { padding: 10px 14px; background: #efe6d2; font-size: 14px; }
  .row { display: flex; justify-content: space-between; padding: 12px 14px; border-top: 1px solid #eee; }
  .hint { width: 560px; margin: 0 auto 28px; font-size: 13px; color: #6b645a; }
</style>
</head>
<body>
  <div class="frame">
    <div class="banner">Rascunho de proposta, não é o painel</div>
    <header>Radar MDE</header>
    <div class="dialog">
      <div class="field">santo andre</div>
      <div class="group">Há mais de um município com esse nome</div>
      <div class="row"><span>Santo André (SP)</span><span>782.048 hab.</span></div>
      <div class="row"><span>Santo André (PB)</span><span>2.708 hab.</span></div>
    </div>
    <p class="hint">Enter não escolhe sozinho. A pessoa seleciona a linha.</p>
  </div>
</body>
</html>
