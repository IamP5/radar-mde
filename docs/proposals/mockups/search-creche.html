<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Rascunho: busca creche</title>
<style>
  body { margin: 0; background: #f4f1ea; font: 16px/1.4 "Segoe UI", sans-serif; color: #1c1915; }
  .frame { width: 880px; margin: 24px auto; background: #fff; border: 1px solid #d9d3c7; }
  .banner { background: #efe6d2; padding: 8px 16px; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
  header { display: flex; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #eee; }
  .brand { font-weight: 700; }
  .dialog { margin: 28px auto; width: 560px; border: 1px solid #1c1915; background: #fff; }
  .field { padding: 12px 14px; border-bottom: 1px solid #1c1915; font-size: 18px; }
  .group { padding: 8px 14px 4px; font-size: 12px; text-transform: uppercase; color: #6b645a; }
  .row { display: flex; justify-content: space-between; padding: 10px 14px; }
  .row.sel { background: #1c1915; color: #fff; }
  .row.dim { color: #3f3a33; }
  .meta { font-size: 13px; opacity: 0.8; }
</style>
</head>
<body>
  <div class="frame">
    <div class="banner">Rascunho de proposta, não é o painel</div>
    <header><span class="brand">Radar MDE</span><span>Buscar</span></header>
    <div class="dialog" role="dialog" aria-label="Buscar município, estado ou região">
      <div class="field">creche</div>
      <div class="group">Temas</div>
      <div class="row sel"><span>Creche</span><span class="meta">Tema</span></div>
      <div class="group">Municípios com nome parecido</div>
      <div class="row dim"><span>Frecheirinha (CE)</span><span class="meta">Você quis dizer</span></div>
    </div>
  </div>
</body>
</html>
